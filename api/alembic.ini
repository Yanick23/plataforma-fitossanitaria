# Migrações da base de dados (Alembic). A API aplica-as sozinha no arranque.
# Manualmente, a partir da pasta api/:
#   alembic upgrade head          # aplicar
#   alembic revision -m "..."     # nova migração (editar o ficheiro criado em migracoes/versions/)
# O endereço da base vem de DATABASE_URL (api/.env), não deste ficheiro.

[alembic]
script_location = %(here)s/migracoes
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
